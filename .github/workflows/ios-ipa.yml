name: ios-ipa

# Builds an unsigned IPA and drops it as a release in the PRIVATE
# Project516/goldeneye-ios-builds repo. This repo is public so macOS runner
# minutes are free, but a public repo's artifacts are downloadable by anyone,
# so nothing playable is published here.
#
# Manual only, on purpose: it costs a macOS runner and it needs two secrets.
#
# The IPA this produces installs and launches but does not yet render: fast3d
# still targets desktop GL 3.3 rather than GLES3 or Metal, so expect it to
# fail at renderer init on device. It is built anyway because it exercises the
# whole delivery chain, and because a bundle that boots is the thing the
# renderer work gets tested against.
#
# The IPA contains no ROM data. romassets_u.s is nothing but absolute cart
# addresses, so the ROM is needed at build time only to convert the asset
# sidecars, and it plus everything derived from it is deleted before publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag in the drop repo (default: ios-<run number>)'
        required: false
        type: string
      check_token_only:
        description: 'Only verify IPA_DROP_TOKEN can publish, then stop'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Proves IPA_DROP_TOKEN can actually write a release to the drop repo, on a
  # Linux runner so it costs nothing. Publishes a draft and deletes it.
  token-check:
    if: inputs.check_token_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish and delete a draft release
        env:
          GH_TOKEN: ${{ secrets.IPA_DROP_TOKEN }}
          REPO: Project516/goldeneye-ios-builds
        run: |
          [ -n "$GH_TOKEN" ] || { echo "IPA_DROP_TOKEN is missing" >&2; exit 1; }
          gh repo view "$REPO" --json name,visibility
          TAG="token-check-${{ github.run_id }}"
          gh release create "$TAG" --repo "$REPO" --draft \
            --title "token check" --notes "Delete me."
          # No --cleanup-tag: a draft release never creates the tag, so
          # deleting it 422s on a reference that does not exist.
          gh release delete "$TAG" --repo "$REPO" --yes
          echo "IPA_DROP_TOKEN can read and publish to $REPO"

  ipa:
    if: ${{ !inputs.check_token_only }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the token is present
        env:
          DROP_TOKEN: ${{ secrets.IPA_DROP_TOKEN }}
        run: |
          [ -n "$DROP_TOKEN" ] || { echo "IPA_DROP_TOKEN secret is missing" >&2; exit 1; }

      # From a release asset on the private drop repo. Deleted, along with
      # everything derived from it, before the IPA is published.
      - name: Fetch the ROM
        env:
          GH_TOKEN: ${{ secrets.IPA_DROP_TOKEN }}
        run: |
          gh release download rom-ntsc-u \
            --repo Project516/goldeneye-ios-builds \
            --pattern baserom.u.z64 --clobber
          echo "abe01e4aeb033b6c0836819f549c791b26cfde83  baserom.u.z64" | shasum -c -

      - name: Extract assets
        run: ./scripts/extract_baserom.u.sh

      - name: Regenerate ROM-asset symbol file (US, Mach-O)
        run: python3 scripts/gen_romassets.py u --macho

      - name: Build
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DROMID=ntsc-final \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build build-ios --config Release -- CODE_SIGNING_ALLOWED=NO

      # SideStore re-signs on device, so the IPA stays unsigned. An IPA is just
      # a zip with the .app under Payload/.
      - name: Locate the app bundle
        id: bundle
        run: |
          APP=$(find build-ios -maxdepth 4 -name '*.app' -type d | head -1)
          [ -n "$APP" ] || {
            echo "No .app bundle. The CMake target is still a plain" >&2
            echo "executable; the iOS app shell has not landed yet." >&2
            exit 1
          }
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R "${{ steps.bundle.outputs.app }}" Payload/
          zip -qry goldeneye-ios.ipa Payload
          ls -la goldeneye-ios.ipa

      # The converted sidecars cannot be produced on the device, so they ship
      # alongside the IPA. Paths are top-level on purpose: sysResolvePath maps
      # "$S/" to Documents on iOS, and the port looks for
      # "pccg-<region>/pccg.bin", so the archive extracts straight into
      # Documents.
      - name: Package the asset sidecars
        run: |
          tar -czf goldeneye-ios-assets.tar.gz \
            -C data pccg-ntsc-final pcmodels-ntsc-final
          ls -la goldeneye-ios-assets.tar.gz

      - name: Drop the ROM and the converted assets
        run: rm -rf baserom.u.z64 assets data Payload

      - name: Publish to the private drop repo
        env:
          GH_TOKEN: ${{ secrets.IPA_DROP_TOKEN }}
          TAG: ${{ inputs.tag || format('ios-{0}', github.run_number) }}
          SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<EOF
          Unsigned IPA from goldeneye-ios $SHA.

          1. Open \`goldeneye-ios.ipa\` in SideStore. It re-signs on device.
          2. In Files, go to On My iPhone > GoldenEye and put your own
             \`ge007.ntsc-final.z64\` (or \`baserom.u.z64\`) there.
          3. Extract \`goldeneye-ios-assets.tar.gz\` into that same folder, so
             \`pccg-ntsc-final/\` and \`pcmodels-ntsc-final/\` sit next to the
             ROM. These are converted from the ROM at build time and cannot be
             produced on the device.

          The renderer still targets desktop GL, so expect this to fail at
          renderer init rather than to play.

          When it does, \`ge007.log\` appears in that same folder. That is the
          whole log, not just the crash, and it is what to send back.
          EOF
          gh release create "$TAG" \
            goldeneye-ios.ipa goldeneye-ios-assets.tar.gz \
            --repo Project516/goldeneye-ios-builds \
            --title "goldeneye-ios $TAG" \
            --notes-file notes.md
