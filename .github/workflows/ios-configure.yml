name: ios-configure

# How far an iOS configure of the game gets. This is expected to fail for now,
# so it never blocks: the game still needs SDL2 and zlib built for iOS and a
# GLES or Metal backend for fast3d. The point is a running record of what the
# next blocker actually is, on a real macOS toolchain rather than guessed at
# from Linux.
on:
  push:
    branches: [ master ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'port/**'
      - 'src/**'
      - 'include/**'
      - '.github/workflows/ios-configure.yml'
  workflow_dispatch:

permissions:
  contents: read

# Not cancel-in-progress. This workflow exists to report the iOS error
# profile for a commit, and a push during a run destroys exactly that: several
# runs have been cancelled mid-configure and reported nothing, which reads
# identically to "zero errors".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configure:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          cmake --version | head -1
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "sdk=$SDK"
          echo "--- clang++ ---"
          xcrun --sdk iphoneos --find clang++
          # Two guesses at where libc++ lives have now been wrong, so ask the
          # compiler instead of guessing a third time.
          echo "--- C++ include search list for the iOS target ---"
          echo | "$(xcrun --sdk iphoneos --find clang++)" -x c++ -E -v \
            -target arm64-apple-ios15.0 -isysroot "$SDK" - 2>&1 \
            | sed -n '/#include <...> search starts here/,/End of search list/p'

      # The ROM sizes the images segment (everything after obseg to the end of
      # the ROM). Without it gen_romassets.py falls back to the CSV maximum,
      # which is short, so the generated symbols are wrong at runtime even
      # though they compile.
      #
      # It comes from a release asset on the private drop repo. The R2 bucket
      # was the first choice but Cloudflare 403s a runner. Never fatal here:
      # this workflow's job is to report the iOS error profile, and a missing
      # ROM does not affect whether the tree compiles.
      - name: Fetch the ROM
        env:
          GH_TOKEN: ${{ secrets.IPA_DROP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::IPA_DROP_TOKEN unset; images segment sized from the CSV"
            exit 0
          fi
          if ! gh release download rom-ntsc-u \
                 --repo Project516/goldeneye-ios-builds \
                 --pattern baserom.u.z64 --clobber; then
            echo "::warning::ROM download failed; images segment sized from the CSV"
            exit 0
          fi
          if ! echo "abe01e4aeb033b6c0836819f549c791b26cfde83  baserom.u.z64" | shasum -c -; then
            echo "::warning::ROM hash mismatch; discarding it"
            rm -f baserom.u.z64
          fi

      # Mach-O needs different section syntax and underscore-prefixed symbols.
      - name: Regenerate ROM-asset symbol file (US, Mach-O)
        run: python3 scripts/gen_romassets.py u --macho

      - name: Drop the ROM
        if: always()
        run: rm -f baserom.u.z64

      - name: Configure for iOS
        continue-on-error: true
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DROMID=ntsc-final \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee configure.log

      - name: Build for iOS
        if: success()
        continue-on-error: true
        run: |
          cmake --build build-ios --config Release -- \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || true

      - name: Report the first blocker
        run: |
          echo "### iOS configure" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            echo "Configure succeeded. Build errors, most common first:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -oE "error: .*" build.log | sed "s/'[^']*'/X/g" \
              | sort | uniq -c | sort -rn | head -15 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "Total errors: $(grep -c 'error:' build.log)" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q "Configuring done" configure.log; then
            echo "Configure succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "First error:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -m1 -A6 -E "CMake Error|error:" configure.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
