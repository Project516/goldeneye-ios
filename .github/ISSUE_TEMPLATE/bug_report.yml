name: Bug report (build or run)
description: A build failure, crash, hang, or rendering/audio/input defect in the port
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report. First, please check:

        - This is a hard fork of
          [goldeneye-pc-port](https://github.com/jkdansereau/goldeneye-pc-port).
          File issues about the PC port itself there, not here.
        - The Linux build works. The front end and all 21 solo missions load
          and render; there is no audio yet.
        - The iOS port is at the memory-rebase stage. Nothing is playable on
          iOS yet, so "it doesn't run on my phone" isn't a bug report, it's
          expected.
        - Do not attach a ROM, extracted assets, or any game data.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
      placeholder: 311fd012
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Region / ROMID
      options: [ntsc-final, pal-final, jpn-final]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / environment
      description: e.g. "Ubuntu 24.04, gcc-14" or "iOS 17, probe-ios build"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Which stage fails?
      options:
        - Asset extraction
        - CMake configure
        - Compile / link
        - "Runtime: crash or hang"
        - "Runtime: wrong rendering / audio / input"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened vs. what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, flags (e.g. `-level_09`), and what you did in-game.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the terminal error, and the crash log if the port crashed.
        For a rendering defect, attach a screenshot.
      render: text
